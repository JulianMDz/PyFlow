[project]
name = "payflow"
version = "0.1.0"
description = "Installment payments (buy now, pay later) API with AI risk scoring"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run: the app's connection pool is created once and its
# asyncpg connections belong to the loop that opened them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async layer runs on greenlets; without this, lines after an `await db...`
# are reported as never executed.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py312"
# Alembic writes these files; they are reviewed, not hand-formatted
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the "alembic" import is the library
known-third-party = ["alembic"]
known-first-party = ["app", "scripts", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as default arguments
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
